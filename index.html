function saleForm(id){const s=db.sales.find(x=>x.id==id);form('বিক্রয় সম্পাদনা',[['cn','কাস্টমারের নাম','text',db.custs.map(c=>c.n)],['d','তারিখ','date'],['pm','পেমেন্ট মাধ্যম','sel',PM],['p','পরিশোধ','number']],o=>{const paid=Math.min(Math.max(o.p??s.paid,0),s.total),due=Math.round((s.total-paid)*100)/100;if(due>0&&!o.cn)return toast('বাকি থাকলে কাস্টমারের নাম দিন'),false;cdue(s.cn,-s.due);Object.assign(s,{cn:o.cn,d:o.d||s.d,pm:o.pm,paid,due});cdue(s.cn,due)},{cn:s.cn,d:s.d,pm:s.pm,p:s.paid})}
const rHtml=s=>{const sub=sum(s.it,i=>i.p*i.q);return `<h2>${esc(db.name)}</h2><p>${s.d}, ইনভয়েস ${String(s.id).slice(-5)}${s.cn?'<br>কাস্টমার: '+esc(s.cn):''}${s.pm?'<br>পেমেন্ট: '+esc(s.pm):''}</p><table><tr><th>ওষুধ<th>টাকা</tr>${s.it.map(i=>`<tr><td>${esc(i.n)}<small>${i.q} × ${i.p}</small><td>${tk(i.p*i.q)}</tr>`).join('')}</table><p>মোট দাম: ${tk(sub)}<br>ছাড়: ${tk(sub-s.total)}<br>পরিশোধযোগ্য: <b>${tk(s.total)}</b><br>পরিশোধ: ${tk(s.paid)}<br>বাকি: ${tk(s.due)}</p>`};
function rcpt(id){const s=db.sales.find(x=>x.id==id);RID=id;const h=rHtml(s);setH('rc',h);setH('md',`<div class=box><div class=rv>${h}</div><div class=bar style="margin-top:10px"><button onclick=closeM()>বন্ধ করুন</button><button onclick=window.print()>প্রিন্ট</button><button class=pr onclick=sharePdf()>পিডিএফ শেয়ার</button></div></div>`);$('md').className='m on'}
function mkPdf(jpg,w,h,cw,ch){const e=new TextEncoder(),B=[],off=[];let len=0;const add=x=>{const b=typeof x=='string'?e.encode(x):x;B.push(b);len+=b.length};
const ob=(n,d,st)=>{off[n]=len;add(n+' 0 obj\n'+d+(st?'\nstream\n':'\n'));if(st){add(st);add('\nendstream\n')}add('endobj\n')};
add('%PDF-1.4\n');ob(1,'<</Type/Catalog/Pages 2 0 R>>');ob(2,'<</Type/Pages/Kids[3 0 R]/Count 1>>');ob(3,`<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${w} ${h}]/Resources<</XObject<</I 4 0 R>>>>/Contents 5 0 R>>`);
ob(4,`<</Type/XObject/Subtype/Image/Width ${cw}/Height ${ch}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${jpg.length}>>`,jpg);
const cs=`q ${w} 0 0 ${h} 0 0 cm /I Do Q`;ob(5,`<</Length ${cs.length}>>`,cs);const x=len;
add('xref\n0 6\n0000000000 65535 f \n'+[1,2,3,4,5].map(n=>String(off[n]).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<</Size 6/Root 1 0 R>>\nstartxref\n${x}\n%%EOF`);return new Blob(B,{type:'application/pdf'})}
async function sharePdf(){const s=db.sales.find(x=>x.id==RID);try{await document.fonts.ready;const sub=sum(s.it,i=>i.p*i.q),W=320,LH=24;
const R=[[db.name,'',2],[s.d+'  #'+String(s.id).slice(-5)],...(s.cn?[['কাস্টমার: '+s.cn]]:[]),...(s.pm?[['পেমেন্ট: '+s.pm]]:[]),['-'],...s.it.flatMap(i=>[[i.n,'',1],['   '+i.q+' × '+i.p,tk(i.p*i.q)]]),['-'],['মোট দাম',tk(sub)],['ছাড়',tk(sub-s.total)],['পরিশোধযোগ্য',tk(s.total),1],['পরিশোধ',tk(s.paid)],['বাকি',tk(s.due)]];
const H=R.length*LH+24,c=document.createElement('canvas');c.width=W*2;c.height=H*2;const x=c.getContext('2d');x.scale(2,2);x.fillStyle='#fff';x.fillRect(0,0,W,H);x.fillStyle='#000';
R.forEach((r,i)=>{const y=i*LH+28,f="'Hind Siliguri','Noto Sans Bengali',sans-serif";if(r[0]=='-'){x.fillRect(12,y-14,W-24,1);return}
x.font=(r[2]?'700 ':'')+(r[2]==2?18:14)+'px '+f;const rt=L(r[1]||'');x.textAlign='left';const rw=rt?x.measureText(rt).width+10:0;x.fillText(L(r[0]),12,y,W-24-rw);if(rt){x.textAlign='right';x.fillText(rt,W-12,y)}});
const d=c.toDataURL('image/jpeg',.92).split(',')[1],jpg=Uint8Array.from(atob(d),k=>k.charCodeAt(0)),blob=mkPdf(jpg,W,H,W*2,H*2),f=new File([blob],'receipt-'+String(s.id).slice(-5)+'.pdf',{type:'application/pdf'});
if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:db.name});else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=f.name;a.click()}}catch(e){if(e.name!='AbortError')toast('পিডিএফ তৈরি করা যায়নি')}}
function restore(){try{const d=JSON.parse($('bk').value);if(!d.meds)throw 0;db=d;save();render();toast('রিস্টোর হয়েছে')}catch(e){toast('কোড সঠিক নয়')}}
const hs=async s=>{try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('ph:'+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return btoa(unescape(encodeURIComponent('ph:'+s)))}};
const getA=()=>{try{return JSON.parse(localStorage.getItem(AK))}catch(e){return null}};
function boot(){applyUI();const a=getA();if(a&&sessionStorage.getItem('pin')=='1'){document.body.className='';render();return}
document.body.className='lo';setH('login',`<div class=box><h3>${a?'লগইন':'প্রথমবার ইউজারনেম ও পাসওয়ার্ড তৈরি করুন'}</h3><label>ইউজারনেম<input id=lu autocomplete=username></label><label>পাসওয়ার্ড<input id=lp type=password autocomplete=current-password onkeydown="if(event.key=='Enter')doLogin()"></label><button class=pr style="width:100%;margin-top:8px" onclick=doLogin()>${a?'লগইন':'অ্যাকাউন্ট তৈরি করুন'}</button><div class=bar style="margin:10px 0 0">${ctls()}</div></div>`)}
async function doLogin(){const u=$('lu').value.trim(),p=$('lp').value,a=getA();if(!u||p.length<4)return toast('ইউজারনেম দিন ও পাসওয়ার্ড কমপক্ষে ৪ অক্ষর');const h=await hs(p);if(!a)localStorage.setItem(AK,JSON.stringify({u,h}));else if(a.u!=u||a.h!=h)return toast('ইউজারনেম বা পাসওয়ার্ড ভুল');sessionStorage.setItem('pin','1');boot()}
function logout(){sessionStorage.removeItem('pin');boot()}
function credForm(){form('ইউজারনেম/পাসওয়ার্ড পরিবর্তন',[['u','নতুন ইউজারনেম'],['p','নতুন পাসওয়ার্ড','password']],o=>{if(!o.u||(o.p||'').length<4)return toast('ইউজারনেম দিন ও পাসওয়ার্ড কমপক্ষে ৪ অক্ষর'),false;hs(o.p).then(h=>{localStorage.setItem(AK,JSON.stringify({u:o.u,h}));toast('পরিবর্তন হয়েছে')})},{u:(getA()||{}).u})}
boot();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
